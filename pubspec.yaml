name: budgetscan
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.15.1
  permission_handler: ^11.3.1
  flutter_litert: ^3.2.1
  image: ^4.9.1
  wakelock_plus: ^1.6.1
  path_provider: ^2.1.4
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#050810"
  background_image: "assets/splash/logo_fullscreen.png"
  android_12:
    color: "#050810"
    fullscreen: true
    android_gravity: fill

flutter:
  uses-material-design: true

  assets:
    - assets/ml/best_float32.tflite
    - assets/icon/app_icon.png
    - assets/splash/logo_fullscreen.png
    - assets/splash/logo_start.gif
